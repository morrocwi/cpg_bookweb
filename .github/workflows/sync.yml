name: sync-cpg-book

# notify ── supabase ── git, wired together:
#   git  : cpg_book pushes a `cpg_book_updated` repository_dispatch here (see cpg_book repo),
#          also runs on a schedule and manually.
#   build: regenerate articles.json from the real cpg_book content.
#   supabase: upsert rows into the `articles` table (only if SUPABASE_SERVICE_KEY is set).
#   notify: announce the result (Discord/Telegram/LINE — only if a channel secret is set).
# GitHub Pages redeploys automatically when articles.json is committed.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [cpg_book_updated]
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-cpg-book
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out cpg_book content
        uses: actions/checkout@v4
        with:
          repository: morrocwi/cpg_book
          path: .cpg_book

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      - name: Build articles.json from cpg_book (+ upsert to Supabase if configured)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python tools/build_articles.py --book-dir .cpg_book --out articles.json \
            ${SUPABASE_SERVICE_KEY:+--push-supabase}

      - name: Commit refreshed articles.json
        run: |
          git config user.name  "cpg-bookweb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add articles.json
          git diff --cached --quiet && echo "no changes" || git commit -m "chore: sync articles from cpg_book"
          git push || echo "nothing to push"

      - name: Notify
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
        run: |
          N=$(python -c "import json;print(len(json.load(open('articles.json'))['articles']))" 2>/dev/null || echo "?")
          python tools/notify.py "ห้องสมุดสบายๆ · ซิงก์ ${{ job.status }} — ${N} บทความจาก cpg_book"
